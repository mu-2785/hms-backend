spring:
  datasource:
#    url: jdbc:mysql://localhost:3306/hms_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    url: jdbc:mysql://localhost:3306/hms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # IMPORTANT: Flyway owns the schema. Hibernate must never auto-generate DDL.
      # "validate" makes Hibernate check entities against the schema Flyway created,
      # and fails fast at startup if they drift apart.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
